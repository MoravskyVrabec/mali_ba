<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mali-Ba</title>
<!-- Web front end for the Mali-Ba game server (protocol 2, docs/design/GAME_SERVER_PROTOCOL.md).
     No rules here: it draws what the server sends and sends back one of the legal moves. -->
<style>
:root {
  --bg: #f4f0e6; --panel: #fbf8f1; --ink: #2b2620; --muted: #776d60; --line: #d5ccbb;
  --accent: #b5651d; --accent-ink: #fff; --hi: #e9d34a; --sel: #f59e0b; --bad: #9b2c2c;
  --hex: rgba(245, 241, 232, 0.55); --hex-line: rgba(70, 60, 50, 0.55);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink);
         border-radius: 7px; padding: 6px 10px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
input, select { font: inherit; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
h1 { font-size: 22px; margin: 0 0 12px; }
h2 { font-size: 15px; margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.hidden { display: none !important; }

/* lobby */
#lobby { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.seatrow { display: grid; grid-template-columns: 70px 130px 1fr 90px; gap: 8px; align-items: center; margin: 6px 0; }
.seatrow input[type=number] { width: 90px; }
.opts { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 10px; }
.games { width: 100%; border-collapse: collapse; }
.games td, .games th { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.games td button { margin: 2px 4px 2px 0; padding: 3px 8px; }

/* game */
#game { display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
#boardwrap { position: relative; overflow: hidden; background: #dfe9ee; touch-action: none; }
#board { width: 100%; height: 100%; display: block; user-select: none; }
#boardtools { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; }
#boardtools button { padding: 3px 9px; background: rgba(255,255,255,.9); }
#side { background: var(--panel); border-left: 1px solid var(--line); padding: 12px 14px; overflow-y: auto;
        display: flex; flex-direction: column; gap: 10px; }
.seat { display: flex; align-items: flex-start; gap: 8px; padding: 4px 6px; border-radius: 6px; }
.seat.turn { background: #f3e7c9; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #333; flex: none; margin-top: 3px; }
#moves { display: flex; flex-direction: column; gap: 5px; max-height: 42vh; overflow-y: auto; padding-right: 2px; }
#moves button { text-align: left; }
#moves button:hover { background: var(--hi); }
#status { color: var(--bad); min-height: 1.2em; }
#turnctl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#turnctl button { padding: 9px 10px; font-weight: 600; }
#turnctl button:disabled { opacity: .45; cursor: default; border-color: var(--line); }
#completebtn:not(:disabled) { background: #2f7d32; border-color: #2f7d32; }
#history div { display: flex; gap: 6px; align-items: center; }
#history .dot { width: 9px; height: 9px; margin: 0; }
#result { position: absolute; left: 14px; top: 50px; max-width: min(640px, calc(100% - 28px)); max-height: calc(100% - 64px);
          overflow: auto; background: rgba(255,255,255,.96); border: 2px solid var(--ink); border-radius: 10px; padding: 12px 16px; }
#result pre { font-size: 12.5px; margin: 8px 0 0; white-space: pre-wrap; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; }
svg text { pointer-events: none; }
.hex { fill: var(--hex); stroke: var(--hex-line); stroke-width: 0.6; }
.hex.hi { fill: rgba(233, 211, 74, 0.75); stroke: #6b5b00; stroke-width: 1.4; cursor: pointer; }
.hex.sel { fill: rgba(245, 158, 11, 0.8); stroke: #7a3d00; stroke-width: 2; }
.hex.hi:hover { fill: rgba(250, 230, 90, 0.95); }

@media (max-width: 860px) {
  #game { grid-template-columns: 1fr; grid-template-rows: 58vh auto; height: auto; min-height: 100vh; }
  #side { border-left: 0; border-top: 1px solid var(--line); }
  #moves { max-height: none; }
  .seatrow { grid-template-columns: 60px 1fr; }
}
</style>
</head>
<body>

<div id="lobby">
  <h1>Mali-Ba</h1>
  <div class="card">
    <strong>New game</strong>
    <div id="seats"></div>
    <div class="opts">
      <label>Your name <input id="myname" size="12" placeholder="optional"></label>
      <label>Bot delay <input id="delay" type="number" min="0" max="10" step="0.1" value="0.5" style="width:70px"> s</label>
      <label><input id="hotseat" type="checkbox"> play every human seat on this device</label>
      <button class="primary" id="create">Create game</button>
    </div>
    <div id="lobbymsg" class="small muted" style="margin-top:8px"></div>
  </div>
  <h2>Games on this server</h2>
  <table class="games"><tbody id="gamelist"><tr><td class="muted">loading...</td></tr></tbody></table>
</div>

<div id="game" class="hidden">
  <div id="boardwrap">
    <svg id="board"></svg>
    <div id="boardtools">
      <button id="lobbybtn" title="Back to the game list">&larr; Games</button>
      <button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">&minus;</button>
      <button id="zfit" title="Fit the board">Fit</button>
      <button id="routesbtn" title="Show or hide trade routes">Routes</button>
    </div>
    <div id="result" class="hidden"></div>
  </div>
  <div id="side">
    <div><strong id="gtitle">Mali-Ba</strong> <span id="role" class="small muted"></span></div>
    <div id="seatlist"></div>
    <div class="small muted" id="phase"></div>
    <div id="joinbox" class="hidden small"></div>
    <div id="status" class="small"></div>
    <div id="prompt"></div>
    <div id="turnctl" class="hidden">
      <button id="restartbtn" title="Put the game back to the start of your turn">Restart Turn</button>
      <button id="completebtn" class="primary" title="Pass play to the next player (Enter)">Complete Turn</button>
    </div>
    <div id="moves"></div>
    <div id="hover" class="small muted"></div>
    <div>
      <div class="small muted">Recent moves</div>
      <div id="history" class="small"></div>
    </div>
    <div class="legend small muted">
      <span>&#9679; token</span><span>&#9650; post</span><span>&#9632; center</span><span>&middot; meeples</span>
    </div>
  </div>
</div>

<script>
"use strict";
const PROTOCOL = 2;
const PLAYER_RGB = ["#ff5050", "#50d050", "#8c8cff", "#c850ff", "#ff96c8"];
const MEEPLE_RGB = ["#000000", "#646464", "#c0c0c0", "#dcdcdc", "#ffffff",
                    "#ffd700", "#ffeb9c", "#cd7f32", "#e2ad7d", "#d2b48c"];
const R = 20;                       // hex radius in board units (SVG)
const SQ3 = Math.sqrt(3);
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";

// ---------- small helpers ----------
function store(key, val) {           // per-browser seat tokens; the page works without them
  try {
    if (val === undefined) return JSON.parse(localStorage.getItem(key) || "null");
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) { return null; }
}
async function api(method, path, body) {
  const r = await fetch(path, {method, headers: {"Content-Type": "application/json"},
                               body: body === undefined ? undefined : JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
const key = h => h.join(",");
const px = h => [R * 1.5 * h[0], R * SQ3 * (h[1] - h[2]) / 2];

// ---------- lobby ----------
let MODELS = [], INFO = null;
function seatRow(i, def) {
  const row = document.createElement("div");
  row.className = "seatrow";
  row.innerHTML = `<span class="muted">Seat ${i + 1}</span>
    <select class="stype"><option value="human">Human</option><option value="network">Network</option>
      <option value="heuristic">Heuristic</option></select>
    <select class="smodel">${MODELS.map(m => `<option>${esc(m.id)}</option>`).join("")}</select>
    <input class="ssims" type="number" min="1" max="${INFO.max_sims}" value="${INFO.default_sims}" title="simulations per move">`;
  const type = row.querySelector(".stype");
  type.value = def;
  const sync = () => {
    const net = type.value === "network";
    row.querySelector(".smodel").style.visibility = net ? "visible" : "hidden";
    row.querySelector(".ssims").style.visibility = net ? "visible" : "hidden";
  };
  type.onchange = sync; sync();
  return row;
}
async function showLobby() {
  closeGame();
  $("game").classList.add("hidden"); $("lobby").classList.remove("hidden");
  refreshGames();
}
async function refreshGames() {
  if ($("lobby").classList.contains("hidden")) return;
  try {
    const games = await api("GET", "/api/games");
    const mine = store("maliba.tokens") || {};
    $("gamelist").innerHTML = games.length ? "" : `<tr><td class="muted">No games yet.</td></tr>`;
    for (const g of games) {
      const tr = document.createElement("tr");
      const names = g.seats.map(s => esc(s.name) + (s.type === "human" && !s.claimed ? " <em class='muted'>(open)</em>" : "")).join(", ");
      const state = g.over ? "finished" : `move ${g.moves}`;
      tr.innerHTML = `<td><code>${esc(g.game_id)}</code></td><td>${names}</td><td class="muted small">${state}</td><td></td>`;
      const td = tr.lastChild;
      const b = (label, fn, primary) => { const x = document.createElement("button"); x.textContent = label;
        if (primary) x.className = "primary"; x.onclick = fn; td.appendChild(x); };
      if (mine[g.game_id]) b("Resume", () => openGame(g.game_id), true);
      for (const s of g.seats) if (s.type === "human" && !s.claimed)
        b(`Join as seat ${s.seat + 1}`, () => joinSeat(g.game_id, s.seat));
      b("Watch", () => openGame(g.game_id));
      $("gamelist").appendChild(tr);
    }
  } catch (e) { $("gamelist").innerHTML = `<tr><td>${esc(e.message)}</td></tr>`; }
}
setInterval(refreshGames, 4000);

async function joinSeat(gid, seat) {
  const name = $("myname").value.trim() || null;
  try {
    const j = await api("POST", `/api/games/${gid}/join`, {seat, name});
    const t = store("maliba.tokens") || {};
    (t[gid] = t[gid] || {})[j.seat] = j.token;
    store("maliba.tokens", t);
    openGame(gid);
  } catch (e) { alert(e.message); }
}
$("create").onclick = async () => {
  const seats = [...document.querySelectorAll(".seatrow")].map(r => {
    const t = r.querySelector(".stype").value;
    if (t === "network") return {type: t, model: r.querySelector(".smodel").value, sims: +r.querySelector(".ssims").value};
    return {type: t};
  });
  const name = $("myname").value.trim();
  store("maliba.name", name);
  const humans = seats.map((s, i) => s.type === "human" ? i : -1).filter(i => i >= 0);
  if (humans.length && name) seats[humans[0]].name = name;
  $("lobbymsg").textContent = "Creating the game (loading a network can take a few seconds)...";
  try {
    const g = await api("POST", "/api/games", {seats, bot_delay: +$("delay").value});
    const take = $("hotseat").checked ? humans : humans.slice(0, 1);
    const t = store("maliba.tokens") || {};
    t[g.game_id] = {};
    for (const s of take) {
      const j = await api("POST", `/api/games/${g.game_id}/join`, {seat: s, name: seats[s].name || null});
      t[g.game_id][s] = j.token;
    }
    store("maliba.tokens", t);
    $("lobbymsg").textContent = "";
    openGame(g.game_id);
  } catch (e) { $("lobbymsg").textContent = e.message; }
};

// ---------- game ----------
let G = null;   // {gid, conns: {seat|"watch": ws}, views: {}, view, cfg, ...}

function closeGame() {
  if (!G) return;
  for (const ws of Object.values(G.conns)) { ws.onclose = null; ws.close(); }
  G = null;
}
function openGame(gid) {
  closeGame();
  location.hash = "g=" + gid;
  $("lobby").classList.add("hidden"); $("game").classList.remove("hidden");
  const tokens = (store("maliba.tokens") || {})[gid] || {};
  G = {gid, conns: {}, views: {}, seqs: {}, view: null, cfg: null, vb: null, selHex: null, filter: new Set(),
       showRoutes: true, hoverMove: null, showResult: true, mine: Object.keys(tokens).map(Number)};
  $("gtitle").textContent = "Game " + gid;
  $("role").textContent = G.mine.length ? "you: seat " + G.mine.map(s => s + 1).join(", ") : "watching";
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const open = (seat, token) => {
    const url = `${proto}//${location.host}/ws/${gid}` + (token ? `?token=${encodeURIComponent(token)}` : "");
    const ws = new WebSocket(url);
    ws.onmessage = ev => onMessage(seat, JSON.parse(ev.data));
    ws.onclose = () => { if (G && G.gid === gid) { status("Connection lost; reconnecting..."); setTimeout(() => {
      if (G && G.gid === gid) G.conns[seat] = open(seat, token); }, 2000); } };
    return ws;
  };
  if (G.mine.length) for (const s of G.mine) G.conns[s] = open(s, tokens[s]);
  else G.conns.watch = open("watch", null);
}
function status(msg) { $("status").textContent = msg || ""; }

function onMessage(seat, m) {
  if (!G) return;
  if (m.type === "welcome") {
    if (m.protocol !== PROTOCOL) status(`Server protocol ${m.protocol}; this page speaks ${PROTOCOL}.`);
    if (!G.cfg) { G.cfg = m.board_config; G.validKeys = new Set(G.cfg.valid_hexes.map(key));
                  G.cityAt = {}; for (const c of G.cfg.cities) G.cityAt[key(c.location)] = c; fit(); }
    G.views[seat] = m.view; G.seqs[seat] = m.seq || 0;
    if (seat !== "watch") status("");
  } else if (m.type === "state") {
    G.views[seat] = m.view; G.seqs[seat] = m.seq || 0;
    if (m.last_move || m.event) status("");
  } else if (m.type === "error") {
    status("Rejected: " + m.message);
    return;
  }
  pickView();
}
function pickView() {
  // The server numbers its state messages; the highest is the newest (a restarted turn
  // makes the history shorter, so history length can't tell).
  const seats = Object.keys(G.views);
  if (!seats.length) return;
  const newest = Math.max(...seats.map(s => G.seqs[s]));
  const latest = G.views[seats.find(s => G.seqs[s] === newest)];
  const cur = latest.current_seat;
  // The seat to move's own view carries its legal moves; use it if it is up to date.
  const v = G.views[cur] && G.seqs[cur] === newest ? G.views[cur] : latest;
  if (v !== G.view) {
    const before = G.view;
    G.view = v;
    if (G.selHex && !movesAt(G.selHex).length) G.selHex = null;
    if (!routeMoves().length) G.filter.clear();
    if (before && !before.result && v.result) G.showResult = true;
    render();
  }
}
const myMoves = () => (G && G.view && G.view.legal_moves) || [];
const routeMoves = () => myMoves().filter(m => m.hexes);
const movesAt = k => myMoves().filter(m => m.hex && key(m.hex) === k);
function listedMoves() {
  const out = myMoves().filter(m => !m.hex && !(m.hexes && G.filter.size &&
        ![...G.filter].every(k => m.hexes.some(h => key(h) === k))));
  return out.concat(G.selHex ? movesAt(G.selHex) : []);
}
function send(m) {
  const ws = G.conns[G.view.current_seat];
  if (!ws) return;
  ws.send(JSON.stringify(m.cmd ? {type: m.cmd} : {type: "move", action: m.action}));
  G.selHex = null; G.filter.clear(); G.hoverMove = null;
  status("");
}
function clickHex(k) {
  if (G.view && G.view.result) { G.showResult = !G.showResult; render(); return; }
  if (routeMoves().some(m => m.hexes.some(h => key(h) === k))) {
    G.filter.has(k) ? G.filter.delete(k) : G.filter.add(k);
    render(); return;
  }
  const here = movesAt(k);
  if (here.length === 1) send(here[0]);
  else { G.selHex = here.length ? k : null; render(); }
}

// ---------- drawing ----------
function fit() {
  const pts = G.cfg.valid_hexes.map(px);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const pad = R * 1.2;
  G.vb = [Math.min(...xs) - pad, Math.min(...ys) - pad,
          Math.max(...xs) - Math.min(...xs) + 2 * pad, Math.max(...ys) - Math.min(...ys) + 2 * pad];
  applyVB();
}
function applyVB() { $("board").setAttribute("viewBox", G.vb.join(" ")); }
function zoom(f, cx, cy) {
  const [x, y, w, h] = G.vb;
  if (cx === undefined) { cx = x + w / 2; cy = y + h / 2; }
  G.vb = [cx - (cx - x) * f, cy - (cy - y) * f, w * f, h * f];
  applyVB();
}
function hexPoints(c) {
  let s = "";
  for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i; s += `${c[0] + R * Math.cos(a)},${c[1] + R * Math.sin(a)} `; }
  return s;
}
function render() { renderBoard(); if (G && G.cfg && G.view) renderSide(); }
function renderBoard() {
  if (!G || !G.cfg || !G.view) return;
  const v = G.view, b = v.board, svg = $("board");
  svg.innerHTML = "";
  const moves = myMoves();
  const hi = new Set(moves.filter(m => m.hex).map(m => key(m.hex)));
  for (const m of routeMoves()) for (const h of m.hexes) hi.add(key(h));
  const mid = b.midTurnState || {};
  const mancala = v.phase.includes("MANCALA") && mid.mancalaHex ? mid.mancalaHex : null;

  if (G.cfg.map_url && G.cfg.map_rect) {
    const [x, y, w, h] = G.cfg.map_rect;
    el("image", {"pointer-events": "none", href: G.cfg.map_url, x: x * R, y: y * R, width: w * R, height: h * R, preserveAspectRatio: "none", opacity: 0.9}, svg);
  }
  // Pieces never take clicks: a click anywhere on a hex is a click on that hex.
  const gHex = el("g", {}, svg), gItems = el("g", {"pointer-events": "none"}, svg),
        gTop = el("g", {"pointer-events": "none"}, svg);
  for (const h of G.cfg.valid_hexes) {
    const k = key(h), c = px(h);
    const cls = "hex" + (k === G.selHex || k === mancala ? " sel" : hi.has(k) ? " hi" : "");
    const p = el("polygon", {points: hexPoints(c), class: cls}, gHex);
    p.addEventListener("click", () => clickHex(k));
    p.addEventListener("mouseenter", () => showHover(k));
    el("text", {x: c[0], y: c[1] - R * 0.62, "font-size": 4.2, "text-anchor": "middle", fill: "#5b5248"}, gHex).textContent = k;
  }
  // meeples: small dots in rows along the lower half of the hex
  for (const [k, ms] of Object.entries(b.hexMeeples || {})) {
    if (!G.validKeys.has(k) || !ms.length) continue;
    const c = px(k.split(",").map(Number)), per = 5, r = R * 0.1;
    ms.forEach((mc, i) => {
      const row = Math.floor(i / per), col = i % per, n = Math.min(per, ms.length - row * per);
      el("circle", {cx: c[0] + (col - (n - 1) / 2) * r * 2.3, cy: c[1] + R * 0.38 + row * r * 2.3, r,
                    fill: MEEPLE_RGB[mc] || "#999", stroke: "#222", "stroke-width": 0.4}, gItems);
    });
  }
  // trade posts (triangles) and centers (squares), around the hex
  for (const [k, posts] of Object.entries(b.tradePosts || {})) {
    const c = px(k.split(",").map(Number)), s = R * 0.17;
    posts.forEach((p, i) => {
      const a = -Math.PI / 2 + 0.9 + i * 0.8, x = c[0] + Math.cos(a) * R * 0.66, y = c[1] + Math.sin(a) * R * 0.66;
      const col = PLAYER_RGB[p.owner] || "#999";
      if (p.type === 2) el("rect", {x: x - s, y: y - s, width: 2 * s, height: 2 * s, fill: col, stroke: "#000", "stroke-width": 0.6}, gItems);
      else el("polygon", {points: `${x},${y - s * 1.2} ${x - s},${y + s * 0.8} ${x + s},${y + s * 0.8}`, fill: col, stroke: "#000", "stroke-width": 0.6}, gItems);
    });
  }
  // cities
  for (const c of G.cfg.cities) {
    const p = px(c.location);
    el("text", {x: p[0], y: p[1] + 1, "font-size": 6.4, "font-weight": 700, "text-anchor": "middle", fill: "#1d1a16",
                stroke: "#fff", "stroke-width": 1.6, "paint-order": "stroke"}, gItems).textContent = c.name;
  }
  // player tokens (circles), upper left of the hex
  for (const [k, owners] of Object.entries(b.playerTokens || {})) {
    const c = px(k.split(",").map(Number));
    owners.forEach((o, i) => {
      const a = Math.PI + 0.6 + i * 0.7;
      el("circle", {cx: c[0] + Math.cos(a) * R * 0.6, cy: c[1] + Math.sin(a) * R * 0.6, r: R * 0.2,
                    fill: PLAYER_RGB[o] || "#999", stroke: "#000", "stroke-width": 0.7}, gItems);
    });
  }
  // declared trade routes
  if (G.showRoutes) for (const rt of b.tradeRoutes || []) drawRoute(gItems, rt.hexes.map(h => h.split(",").map(Number)), PLAYER_RGB[rt.owner], 0.55);
  // route choice: filter marks and the hovered option
  for (const k of G.filter) { const c = px(k.split(",").map(Number));
    el("circle", {cx: c[0], cy: c[1], r: R * 0.82, fill: "none", stroke: "#000", "stroke-width": 1.8}, gTop); }
  if (G.hoverMove && G.hoverMove.hexes) drawRoute(gTop, G.hoverMove.hexes, PLAYER_RGB[v.current_seat], 1, true);
  if (G.hoverMove && G.hoverMove.hex) { const c = px(G.hoverMove.hex);
    el("circle", {cx: c[0], cy: c[1], r: R * 0.85, fill: "none", stroke: "#000", "stroke-width": 2.2}, gTop); }
}
function drawRoute(g, hexes, col, op, big) {
  const pts = hexes.map(px).map(p => p.join(",")).join(" ");
  if (hexes.length > 1) {
    el("polyline", {points: pts, fill: "none", stroke: "#000", "stroke-width": big ? 4.5 : 2.6, opacity: op, "stroke-linejoin": "round"}, g);
    el("polyline", {points: pts, fill: "none", stroke: col, "stroke-width": big ? 3 : 1.6, opacity: op, "stroke-linejoin": "round"}, g);
  }
  if (big) for (const h of hexes) { const c = px(h);
    el("circle", {cx: c[0], cy: c[1], r: R * 0.32, fill: col, stroke: "#000", "stroke-width": 1}, g); }
}
function showHover(k) {
  const c = G.cityAt[k];
  $("hover").innerHTML = `hex ${k}` + (c ? ` &mdash; <strong>${esc(c.name)}</strong> (${esc(c.culture)}): common ${esc(c.common_good)}, rare ${esc(c.rare_good)}` : "");
}
function renderSide() {
  const v = G.view, b = v.board;
  $("seatlist").innerHTML = v.seats.map(s => {
    const i = s.seat, cg = Object.values(b.commonGoods[i] || {}).reduce((a, x) => a + x, 0);
    const rg = b.rareGoods[i] || {}, rgn = Object.values(rg).reduce((a, x) => a + x, 0);
    const you = G.mine.includes(i) ? " (you)" : "";
    return `<div class="seat${v.current_seat === i ? " turn" : ""}"><span class="dot" style="background:${PLAYER_RGB[i]}"></span>
      <div><div>${esc(s.name)}${you}</div><div class="small muted">common ${cg} &middot; rare ${rgn} (${Object.keys(rg).length} kinds) &middot; posts left ${b.playerPostsSupply[i]}</div></div></div>`;
  }).join("");
  $("phase").textContent = "Phase: " + v.phase.replace(/_/g, " ").toLowerCase() + (v.final_round ? " — final round" : "");

  // Spectators may take an open seat (the server says which are open via /api/games).
  $("joinbox").classList.toggle("hidden", G.mine.length > 0 || !!v.result);
  if (!G.mine.length && !v.result && Date.now() - (G.seatCheck || 0) > 3000) {
    G.seatCheck = Date.now();
    api("GET", "/api/games").then(gs => {
      const g = gs.find(x => x.game_id === G.gid); if (!g) return;
      const free = g.seats.filter(s => s.type === "human" && !s.claimed);
      $("joinbox").innerHTML = free.length ? "Open seats: " + free.map(s => `<button onclick="joinSeat('${G.gid}', ${s.seat})">Join as seat ${s.seat + 1}</button>`).join(" ")
        + `<div class="muted">Invite link: <code>${esc(location.origin + "/#g=" + G.gid)}</code></div>` : "";
    }).catch(() => {});
  }

  const moves = myMoves(), listed = listedMoves();
  let prompt = "";
  if (moves.length) {
    if (routeMoves().length) prompt = `<strong>Choose a trade route.</strong> <span class="small muted">Hover an option to see it; click hexes to show only routes through them${G.filter.size ? ` (${G.filter.size} selected; click again to remove)` : ""}.</span>`;
    else if (moves.some(m => m.hex)) prompt = "<strong>Your move:</strong> <span class='small muted'>click a highlighted hex" + (listed.length ? " or choose below" : "") + ".</span>";
    else prompt = "<strong>Your move:</strong>";
  }
  const turn = v.turn, myTurn = turn && turn.seat === v.current_seat && G.mine.includes(turn.seat);
  if (myTurn && turn.complete) prompt = "<strong>Your turn is done.</strong> <span class='small muted'>Complete it to pass play on, or restart it.</span>";
  else if (!moves.length && !v.result && v.current_seat !== null && !myTurn)
    prompt = `<span class="muted">Waiting for ${esc(v.seats[v.current_seat].name)}${turn && turn.complete ? " to complete the turn" : ""}…</span>`;
  $("prompt").innerHTML = prompt;
  // Turn controls for a human at this device: Restart Turn whenever it's their turn,
  // Complete Turn once their moves have passed play on.
  const tc = $("turnctl");
  tc.classList.toggle("hidden", !myTurn);
  if (myTurn) {
    $("restartbtn").disabled = !turn.can_restart;
    $("completebtn").disabled = !turn.complete;
  }
  const mv = $("moves"); mv.innerHTML = "";
  for (const m of listed) {
    const bt = document.createElement("button"); bt.textContent = m.label;
    bt.onclick = () => send(m);
    bt.onmouseenter = () => { G.hoverMove = m; renderBoard(); };
    bt.onmouseleave = () => { if (G.hoverMove === m) { G.hoverMove = null; renderBoard(); } };
    mv.appendChild(bt);
  }
  $("history").innerHTML = v.history.slice(-8).reverse().map(h =>
    `<div><span class="dot" style="background:${PLAYER_RGB[h.seat]}"></span>${esc(h.label)}</div>`).join("");

  const res = $("result");
  if (v.result && G.showResult) {
    const w = v.result.winner;
    const head = w === null ? "Game over: no winner (move cap)" : `${esc(v.seats[w].name)} wins — ${esc(v.result.reason)}`;
    const score = (v.result.score || "").split("\n").filter(l => l.trim() && !l.includes("====")).join("\n");
    res.innerHTML = `<strong>${head}</strong> <button style="float:right" onclick="G.showResult=false;render()">Hide</button><pre>${esc(score)}</pre>`;
    res.classList.remove("hidden");
  } else res.classList.add("hidden");
}

// ---------- pan and zoom ----------
(function () {
  const svg = $("board"); let drag = null;
  const toBoard = (e) => { const r = svg.getBoundingClientRect(), [x, y, w, h] = G.vb;
    const s = Math.max(w / r.width, h / r.height), ox = x + (w - r.width * s) / 2, oy = y + (h - r.height * s) / 2;
    return [ox + (e.clientX - r.left) * s, oy + (e.clientY - r.top) * s, s]; };
  svg.addEventListener("wheel", e => { if (!G || !G.vb) return; e.preventDefault();
    const [bx, by] = toBoard(e); zoom(e.deltaY > 0 ? 1.12 : 1 / 1.12, bx, by); }, {passive: false});
  svg.addEventListener("pointerdown", e => { if (G && G.vb && (e.button === 2 || e.button === 1 || e.pointerType !== "mouse" || e.shiftKey))
    drag = {x: e.clientX, y: e.clientY, moved: 0}; });
  svg.addEventListener("pointermove", e => { if (!drag) return; const [, , s] = toBoard(e);
    G.vb[0] -= (e.clientX - drag.x) * s; G.vb[1] -= (e.clientY - drag.y) * s; drag.moved += Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y);
    drag.x = e.clientX; drag.y = e.clientY; applyVB(); });
  window.addEventListener("pointerup", () => { drag = null; });
  svg.addEventListener("contextmenu", e => e.preventDefault());
})();
$("zin").onclick = () => zoom(1 / 1.25);
$("zout").onclick = () => zoom(1.25);
$("zfit").onclick = () => fit();
$("routesbtn").onclick = () => { G.showRoutes = !G.showRoutes; render(); };
$("lobbybtn").onclick = () => { location.hash = ""; };
$("restartbtn").onclick = () => send({cmd: "restart_turn"});
$("completebtn").onclick = () => send({cmd: "complete_turn"});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && G && G.view && !$("completebtn").disabled && !$("turnctl").classList.contains("hidden")) send({cmd: "complete_turn"});
});

// ---------- routing ----------
async function route() {
  const m = location.hash.match(/g=([\w-]+)/);
  if (!INFO) { try { INFO = await api("GET", "/api/info"); MODELS = await api("GET", "/api/models");
    const seats = $("seats"); for (let i = 0; i < INFO.num_seats; i++)
      seats.appendChild(seatRow(i, i === 0 ? "human" : (i === 1 && MODELS.length ? "network" : "heuristic")));
    $("myname").value = store("maliba.name") || ""; } catch (e) { $("lobbymsg").textContent = "Cannot reach the server: " + e.message; } }
  if (m) { if (!G || G.gid !== m[1]) openGame(m[1]); }
  else showLobby();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
