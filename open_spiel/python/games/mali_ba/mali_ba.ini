[Rules]
# --- ACTION RULES ---
# Determines if creating trade routes is a free action at the end of other actions
# -or- if it's a standalone action like all other actions.
free_action_trade_routes = true

# --- SCORING/VICTORY RULES ---
# Number of active trade routes that will trigger the end game.
end_game_cond_num_routes = -1
;end_game_cond_num_routes = 4
# Number of active trade routes required to BE ABLE to trigger the end game.
end_game_req_numroutes = 2
# Number of unique rare goods that will trigger the end game.
;end_game_cond_num_rare_goods = 6
end_game_cond_num_rare_goods = -1
# Whether the rule is in place that connecting Timbuktu to the coast triggers end game
end_game_cond_timbuktu_to_coast = true
# Whether having a rare good from each region triggers end game
end_game_cond_rare_good_each_region = true
end_game_cond_rare_good_num_regions = 5

# --- SETUP RULES ---
# Seat p starts with p * this many randomly chosen common goods (duplicates allowed)
# (first player 0, second 1, third 2 at the value 1). Offsets the first-mover
# advantage. 0 = off.
starting_common_goods_per_seat = 1
# Place starting tokens in serpentine order (0,1,2,2,1,0,0,1,2) rather than
# round-robin (0,1,2,0,1,2,...), so seat 0 does not get first pick every round.
serpentine_token_placement = true

# --- COST RULES ---
# The cost to upgrade a trading post to a trading center.
upgrade_cost_common = 3
upgrade_cost_rare = 1
# Remove one meeple when upgrading a trading post (if meeples present)
remove_meeple_on_upgrade = true
# Remove one meeple from each hex when declaring a trade route (if meeples present)
remove_meeple_on_trade_route = true
# How many Trading Posts each player starts with
posts_per_player = 5
# If city_free_upgrade == true, a trading post in a city is automatically upgraded to a center when a trade route is declared.
# If false, a trade route can only be declared between existing trading centers.
city_free_upgrade = false


# --- MECHANIC VARIATIONS (Example) ---
# 'none': no capture
# 'opposite_hex': capture meeples on the hex opposite the last placement (classic Oware rule)
# mancala_capture_rule = none

[Heuristics]
# Base weights for different action types in the AI's heuristic choice.
weight_pass = 0.1
weight_mancala = 10.0
weight_upgrade = 15.0
weight_income = 5.0
weight_place_token = 5.0
# Bonus for any move that also declares a trade route.
weight_trade_route_create = 20.0

bonus_upgrade_new_region = 200
bonus_upgrade_diversity_factor = 100

# Bonus for ending a mancala move in a city.
bonus_mancala_city_end = 200.0
# Bonus for mancala moves that travel a long distance (>3 hexes).
bonus_mancala_long_distance = 200.0
# Bonus for landing on a hex that already has a high density of meeples (>2).
bonus_mancala_meeple_density = 100.0
# Generic bonuses for experimental heuristics.
# bonus1: Applied to the 'Take Income' action if the player has a trading center in a city for which they don't have the rare good yet.
bonus1 = 30.0
# bonus2: Applied to the 'Trade Route Create' appended action if the player has 
# 2 or more trading centers that are not part of trade routes yet.
bonus2 = 50.0
# bonus3: Applied to the 'Upgrade Trading Post to Center' action if the player has fewer than 2 
# trading posts in their supply and the game does not have unlimited trading posts
bonus3 = 20.0
# bonus4: Appled to mancala moves that end with creating a trading post
bonus4 = 15.0

[MLTraining]
# Python-side training parameters. CLI args override these values.

# Discount factor applied when turning a finished game into per-step value targets
# (value_t = reward_t + gamma * value_t+1, seeded with the terminal returns).
#
# CAUTION: with gamma < 1 the target for a position depends on how many moves remain,
# but the observation tensor has no move-count or progress plane -- so the network
# cannot distinguish a certain win 400 moves out (target ~ +0.36 at 0.997) from the
# same win 20 moves out (~ +1.13), and regresses to the mean of the two. That is why
# the value head under-predicts sure wins. gamma = 1.0 removes the dependency; the
# "win sooner" incentive is already carried by time_penalty and max_moves_penalty.
#
# If you set 1.0, also shrink the reward magnitudes: undiscounted, a timeout loser
# reaches about max_moves_penalty + loss_penalty + accumulated time_penalty ~ -1.5,
# which is outside the value head's tanh range [-1, +1] and therefore unlearnable.
# The trainer logs VALUE TARGET RANGE every 25 games and warns once if it overflows.
#
# Buffers are NOT comparable across gamma values: entries hold precomputed targets,
# so mixing conventions trains the value head against two definitions at once.
# Start from a fresh buffer when changing this.
gamma = 1.000

# --- Batched GPU inference server ---
# Actors run TensorFlow single-threaded (OMP_NUM_THREADS=1, set deliberately so N
# actors don't oversubscribe the CPU). At 1 thread one batch-1 forward pass through
# both nets costs ~37ms on this host, and actor self-timing shows 99.8% of move-loop
# time is inside mcts_search -- i.e. inference is essentially all of self-play cost:
#
#   threads:      1      2      4      8     16     32
#   ms/call:  37.11  24.42  15.71  11.46   8.23   9.78
#
# Batching does NOT help on CPU (batch-32 single-threaded is 36.6 ms/sample). On the
# GPU the same nets run 0.181 ms/sample at batch 32. With one server process owning
# the GPU and every local actor submitting over shared memory, measured throughput:
#
#   clients:      8     16     25     40     64
#   evals/s:   3414   4652   4367   3139   4461      (CPU baseline: 676)
#
# So ~6.9x more evaluations per second, peaking around 16-25 clients. Remote actors
# are unaffected and keep doing their own CPU inference.
inference_server = true
# Largest batch the server assembles. Batches are padded up to power-of-two buckets
# so only a few graphs are traced; 32 measured best (64 wastes GPU on padding).
inference_max_batch = 72
# Pin the inference server's process to fast cores: auto picks the performance
# cores on an Intel hybrid CPU, or the large-L3 (V-cache) cores on a split-cache
# Ryzen (measured ~5,100 -> ~8,000 evals/s on the 7950X3D). none = no pinning,
# or give a list such as 0-7,16-23.
inference_cpus = auto

# Seconds between trainer steps (train at most once per this interval).
train_interval_seconds = 8
# Total replay buffer capacity (bootstrap + MCTS combined).
# Buffer size does NOT affect sample reuse -- that is set by gradient steps vs
# experiences generated, and the buffer size cancels out of the arithmetic. What it
# controls is how many DISTINCT games a batch can draw from. At ~392 experiences per
# game, 34000 spanned only ~87 games, so many samples in a batch came from the same
# game; 200000 spans ~510. Costs about 17 GB of RAM (~88.6 KB per entry).
replay_buffer_size = 100000
# Keep 1 position in N from each finished game (1 = every position). Keeping every
# move filled the 100k buffer with only ~240 games and the value head memorised them
# (100% winner top-pick on games it trained on, ~50% on new ones). At 16, 100k
# positions span ~3,900 games. A saved buffer written with less thinning is thinned
# to match when it is restored.
buffer_keep_every = 16

# gzip level for replay-buffer saves (0-9). This save is SYNCHRONOUS in the trainer
# loop, so its duration is training time lost. Measured on this machine:
#
#   level      34k entries   200k entries   200k file size
#   9 (gzip default)  41.1s        241.7s        137 MB
#   6                  9.8s         57.4s        149 MB
#   1                  5.4s         31.9s        270 MB
#
# Level 1 saves a 200k buffer faster than level 9 managed for 34k, and the larger
# file is irrelevant at these sizes -- so a bigger buffer does NOT have to mean
# slower saves. Use 6 if you care about file size (e.g. copying buffers between
# machines). The trainer logs "BUFFER SAVE took Ns" after each save.
buffer_compresslevel = 1
# Fraction of near-win timeout games from bootstrap to retain in the buffer.
near_win_bootstrap_pct = 0.050
# Fraction of near-win timeout games from MCTS to insert into the buffer.
near_win_mcts_pct = 1.00
# Fraction of the MCTS buffer capacity reserved for near-win games.
near_win_pool_fraction = 0.35
# Fraction of the MCTS buffer capacity reserved for Rare goods natural wins (guaranteed batch exposure).
# D012 tried 0.10 (with timbuktu 0.20) to match how often each ending occurs; it
# LOST to D011 head to head (0.278, 2026-10-08), so back to 0.20. Rare-goods
# positions matter more than their ~7% share of games suggests.
raregoods_pool_fraction = 0.20
# Fraction of the MCTS buffer capacity (and of every batch) for Timbuktu wins.
# 0 keeps them in the timeout pool with ordinary timeouts (pre-2026-10-01 behaviour),
# where their share falls whenever more timeouts arrive. The timeout pool gets the
# remainder: 1 - near_win - raregoods - timbuktu (0.35 with these values).
# D012 tried 0.20 (with rare goods 0.10); it lost to D011, so back to 0.10.
timbuktu_pool_fraction = 0.10
# Fraction of MCTS games played with an elevated heuristic weight to bias exploration toward Rare goods wins.
# Set to 0.0 to disable. When non-zero, these jobs use rare_goods_actor_heuristic_weight instead of the
# decay-scheduled weight; all other jobs continue on the normal schedule.
rare_goods_actor_fraction = 0.30
# Extra tier-1 simulations added for rare-goods-focused games (on top of sim_tier1_sims).
# Set to 0 to disable. E.g. 100 gives RG-focused actors 250 sims in tier 1 instead of 150.
rare_goods_added_tier1_sims = 100
# Amount added to the decay-scheduled heuristic weight for rare-goods-focused games.
# The resulting weight is: computed_weight + rare_goods_added_heuristic_weight.
# E.g. if the scheduled weight is 0.14 and this is 0.30, focused games run at 0.44.
rare_goods_added_heuristic_weight = 0.050
# Held-out low-guidance test slice: a small fraction of games run at a fixed,
# ABSOLUTE (not additive -- replaces, doesn't add to, the decay-scheduled
# weight) low heuristic guidance value, so the network's own policy/value can
# be measured standing on its own continuously, without testing a guidance
# reduction on the whole fleet and risking a costly win-rate crater across
# every actor. Mutually exclusive with rare_goods_actor_fraction above -- a
# job is either a low-guidance test, RG-focused, or normal, never more than
# one. Tagged "LOW-GUIDANCE-TEST" in the log; grep for it and compare this
# slice's win rate against the main fleet's over time to see whether the
# network is getting closer to independent play. Set to 0.0 to disable.
low_guidance_test_fraction = 0.0
low_guidance_test_weight = 0.02
# Hours without a result before in-flight jobs are assumed lost (spot preemption) and re-queued.
job_timeout_hours = 1.0
# Fraction of replay buffer capacity reserved for MCTS games (remainder is bootstrap).
# Also controls the target batch sampling ratio. When MCTS pool is short early in
# training, bootstrap compensates automatically so the full batch_size is always used.
mcts_buffer_fraction = 1.00
# When the MCTS timeout pool is full, promote evicted entries into the bootstrap pool
# instead of discarding them, gradually replacing heuristic bootstrap data with MCTS data.
replace_bootstrap_with_mcts = false
# Mix of heuristic vs neural network policy in the MCTS prior (0=pure NN, 1=pure heuristic).
heuristic_guidance_weight = 0.30
# Floor value the weight decays to. Set equal to heuristic_guidance_weight to disable decay.
heuristic_guidance_weight_final = 0.30
# MCTS game number where decay begins and ends (linear between the two).
heuristic_guidance_decay_start = 2000
heuristic_guidance_decay_end = 5000
# Minimum number of rare-good regions for a timeout game to qualify as near-win.
near_win_rare_regions = 4
# ==== Culling rules - when should games be terminated early? ====
# Early termination: halt game if no player is near-win after this many moves.
early_termination_move = 999
# Tiered value-head hopeless checks.
# The check runs every 20 moves; threshold in effect depends on current move count.
# hopeless_nearwin_overrideX: if true (default), near-win status exempts the game from
# that level's check. Set to false to cull even near-win games at that level.
# Level 1: applies from hopeless_move1 up to hopeless_move2 - 1
hopeless_move1 = 320
hopeless_thresh1 = -0.34
hopeless_nearwin_override1 = true
# Level 2: applies from hopeless_move2 up to hopeless_move3 - 1
hopeless_move2 = 380
hopeless_thresh2 = -0.3
hopeless_nearwin_override2 = true
# Level 3: applies from hopeless_move3 onwards (use a multiple of 20)
# Set equal to hopeless_move2 to skip straight from level 1 to level 3.
hopeless_move3 = 400
hopeless_thresh3 = -0.3
hopeless_nearwin_override3 = false
# Declining-best rule (applies from move 360 onward): cull if the best player's value is below this at two
# consecutive checks and still falling. 0.0 was the original rule; the calibrated value head
# puts the best player near 0.00 in ordinary late positions, so 0.0 culls many normal games.
declining_best_thresh = -0.99
# Stalled rule (applies from move 400 onward): cull if the best player's value is below this at two
# consecutive checks. Was hard-coded at 0.20 until 2026-10-08. Set below -1 (e.g.
# -2) to switch this rule off on its own; the value head's range is -1..+1.
stalled_thresh = -0.99
# Near-win extension: value threshold for the leader to qualify for the extension.
near_win_extension_value_thresh = 0.99
# Protect a game from early termination if any player's value head score exceeds this threshold.
# Overrides both the no-near-win cut at early_termination_move and the hopeless check.
clear_winner_thresh = 0.30
# ==== end Culling rules - when should games be terminated early? ====
# Tiered MCTS simulation budget (3 tiers, keyed on play-phase move count).
# Tier 1: moves [0, sim_tier2_start)
sim_tier1_sims = 100
# Tier 2: moves [sim_tier2_start, sim_tier3_start)
sim_tier2_start = 100
sim_tier2_sims = 300
# Tier 3: moves [sim_tier3_start, ∞)
sim_tier3_start = 300
sim_tier3_sims = 600

# --- Playout cap randomization (KataGo, Wu 2019) ---
# Overrides every tier and floor above when it fires. With probability
# playout_cap_full_prob a move keeps its full tiered budget and its visit counts
# are recorded as a policy target; otherwise it searches with only
# playout_cap_fast_sims simulations and is stored as a value-only sample (the
# trainer masks it out of the policy loss). Value targets come from the game
# outcome, so every move still trains the value head.
#
# Expected simulations per move at the defaults below, using the tier budgets:
#   0.25 * tier_sims + 0.75 * 40
# which is roughly a 3x reduction in tier-2/3 territory. Set enabled = false to
# restore the old behaviour exactly.
playout_cap_enabled = true
playout_cap_full_prob = 0.25
playout_cap_fast_sims = 40
# Exempt large route declarations (OPTIONAL_ROUTE with at least
# sim_route_decision_min_candidates candidates) from the cap: they always get
# the sim_route_decision_sims floor and are recorded as policy targets. With the
# cap on and no exemption, D006's first ~2,500 games had fewer Timbuktu wins
# (12.4% -> 8.1%) and more rare-goods wins (2.9% -> 7.1%) than D005.
playout_cap_exempt_route_decisions = true

# --- Auxiliary value targets: how does the game end? (2026-10-06) ---
# Extra heads on the value network, trained only by the learner: the ending type
# (timeout / Timbuktu / rare goods) and moves remaining as a fraction of
# max_play_moves. A game gives one result for ~400 positions; these give the
# shared trunk more to learn from about positions heading for an early finish.
# Search, actors and evaluation are unchanged. Weights save as usual, plus a
# _value_aux file holding the extra heads for resuming.
aux_targets = true
aux_win_type_weight = 0.5
aux_moves_left_weight = 1.0

# Phase-keyed override for OPTIONAL_ROUTE decisions (declaring a trade route),
# which can have up to 300 legal candidates -- far more than any other phase.
# This branching factor doesn't track move number (routes get declared
# throughout the game, not just late), so the move-tier budget above under-
# resources most of these decisions. Measured directly from the replay
# buffer (2026-07-25): with only the move-tier budget, OPTIONAL_ROUTE
# decisions were poorly converged (median top-1 visit share ~21%, normalized
# entropy ~0.93 -- i.e. still spread across many candidates, not settled).
# Only decisions with at least sim_route_decision_min_candidates legal
# actions get the boost, so cheap/easy route decisions aren't paying for it.
# This is a FLOOR, not an override: applies max(move-tier budget, this value),
# so a late-game route decision that already qualifies for a higher tier3
# budget keeps that higher number rather than being capped down to this.
sim_route_decision_sims = 600
sim_route_decision_min_candidates = 20

# Fraction of games that bypass all early termination rules (diagnostic use only).
# Logs "NO-KILL — would have terminated" instead of actually terminating.
# Set to 0.0 to disable. Example: 0.20 = 20% of games are never killed early.
# 1.0 from 2026-10-08: culling is off. Culled games were discarded, ~16% of all
# compute for no training data; they now play to their real end. The log still
# marks where each would have been culled, which measures how such games really
# finish (for a future rule that ends settled games early but keeps their data).
random_no_kill_thresh = 1.0

[Training]
# Training reward and penalty parameters for AI learning

# Per-move penalties (applied during gameplay)
time_penalty = -0.0005          # Small penalty per move to encourage faster games

# Terminal game penalties
loss_penalty = -0.1              # penalty for losing players (optional)
draw_penalty = 0.0             # Penalty for games that end in draw
max_moves_penalty = -0.6             # Penalty for games that end in timeout

# Intermediate reward values
upgrade_reward = 0.02           # Reward for placing a trading center (upgrade)
trade_route_reward = 0.05       # Reward for creating a trade route
new_rare_region_reward = 0.05   # Reward for acquiring rare goods from new regions
new_common_good_reward = 0.01   # Reward for acquiring new types of common goods
key_location_post_reward = 0.03 # Reward for placing posts at key locations (Timbuktu, Agadez, Oudane, coast)

# Quick win bonuses
quick_win_bonus = 0.00           # Bonus multiplier for games that finish quickly
quick_win_threshold = 350       # Games under this many moves get the quick win bonus
max_play_moves = 420            # Maximum play-phase moves before a game times out (excluding setup moves)
near_win_extension_moves = 0   # Extra moves granted when a near-win game reaches max_play_moves
# Extra bonus added to the winner's terminal return for Rare goods wins (to counteract Timbuktu mode collapse).
# Set to 0.0 to disable. A value of 0.20 raises the Rare goods winner return from 1.0 to 1.20.
rare_goods_bonus = 0.0

# Reward for the highest-scoring player when a game ends by hitting the move limit
# instead of by a win condition. 1.0 is the historical behaviour: Returns() gave the
# score leader the full win reward no matter HOW the game ended, and max_moves_penalty
# was added afterwards -- so the only thing separating "I won" from "I was merely
# ahead when time ran out" was that penalty. With max_moves_penalty at -0.6 that left
# a gap of just 0.60, and since ~54% of games time out, predicting a near-constant was
# a competitive strategy for the value head.
#
# Value targets at move 0 (gamma=1.0, max_moves_penalty=-0.6, loss_penalty=-0.1):
#
#   setting | win  real loss  TO leader  TO loser | win-vs-TOleader  ordering ok?
#     1.0   | 0.79   -0.31      +0.19     -0.91   |      0.60            yes
#     0.7   | 0.79   -0.31      -0.11     -0.91   |      0.90            yes
#     0.5   | 0.79   -0.31      -0.31     -0.91   |      1.10            marginal
#     0.3   | 0.79   -0.31      -0.51     -0.91   |      1.30            NO
#
# "ordering ok" means win > timeout-leader > real loss > timeout-loser. At 0.3 and
# below, being ahead at the timeout scores worse than losing a decided game, which is
# backwards. 0.7 buys 50% more contrast while keeping the ordering intact. The tanh
# range is unaffected: the floor is the timeout LOSER, which does not depend on this.
#
# Changing this invalidates a saved buffer -- entries hold precomputed value targets.
timeout_leader_reward = 0.7

# --- Observation planes (C-series, from 2026-09-30) ---
# Changing any of these changes the tensor shape: saved weights and the replay
# buffer from a different setting will NOT load. Change only for a from-scratch run.
# move_count_plane: game progress (play moves / max_play_moves).
move_count_plane = 1
# score_planes: each seat's current score / 200 (winner = points leader).
score_planes = 1
# seat_planes: one-hot seat to move (the network otherwise can't tell its colour).
seat_planes = 1
# all_goods_planes: every seat's count of each of the 15 common + 15 rare goods (public).
all_goods_planes = 1
# Usage notes:
# - time_penalty: Applied every move to encourage faster play (negative value)
# - max_moves_penalty: Used in Python training when games hit max length (negative value) 
# - All reward values: Positive numbers encourage these behaviors
# - quick_win_bonus: Multiplier added to winning reward for fast games
# - Adjust these values to tune your AI's learning priorities


